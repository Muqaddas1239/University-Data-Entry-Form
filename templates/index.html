
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>University Student Registration</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
            min-height: 100vh;
            padding: 40px 16px;
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .university-icon {
            width: 64px;
            height: 64px;
            background: #1d4ed8;
            color: white;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            margin: 0 auto 16px;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
            color: #0f172a;
        }

        .header p {
            color: #64748b;
            font-size: 15px;
        }

        .form-card {
            background: white;
            max-width: 650px;
            margin: 0 auto;
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(15, 23, 42, 0.08);
        }

        .form-heading {
            margin-bottom: 26px;
            padding-bottom: 18px;
            border-bottom: 1px solid #e2e8f0;
        }

        .form-heading h2 {
            font-size: 21px;
            margin-bottom: 8px;
        }

        .form-heading p {
            color: #64748b;
            font-size: 14px;
            line-height: 1.5;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            font-size: 14px;
            font-weight: bold;
            color: #334155;
        }

        input,
        select {
            width: 100%;
            padding: 13px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background: white;
            color: #0f172a;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .submit-button {
            width: 100%;
            margin-top: 28px;
            padding: 14px;
            background: #1d4ed8;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .submit-button:hover {
            background: #1e40af;
        }

        .footer {
            text-align: center;
            margin-top: 22px;
            color: #64748b;
            font-size: 13px;
        }

        @media (max-width: 550px) {
            body {
                padding: 24px 12px;
            }

            .form-card {
                padding: 22px 18px;
            }

            .header h1 {
                font-size: 23px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full-width {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>

    <header class="header">
        <div class="university-icon">U</div>
        <h1>University Student Portal</h1>
        <p>Student Information Management System</p>
    </header>

    <main class="form-card">

        <div class="form-heading">
            <h2>Student Registration</h2>
            <p>Please complete the form below to register student information.</p>
        </div>

        <form action="/submit" method="POST">

            <div class="form-grid">

                <div class="form-group">
                    <label for="student_id">Student ID *</label>
                    <input
                        type="text"
                        id="student_id"
                        name="student_id"
                        placeholder="e.g. BS001"
                        required>
                </div>

                <div class="form-group">
                    <label for="name">Full Name *</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter full name"
                        required>
                </div>

                <div class="form-group full-width">
                    <label for="email">Email Address *</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="student@example.com"
                        required>
                </div>

                <div class="form-group">
                    <label for="department">Department *</label>
                    <select id="department" name="department" required>
                        <option value="">Select department</option>
                        <option value="Mathematics">Mathematics</option>
                        <option value="Computer Science">Computer Science</option>
                        <option value="Physics">Physics</option>
                        <option value="Chemistry">Chemistry</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="semester">Semester *</label>
                    <select id="semester" name="semester" required>
                        <option value="">Select semester</option>
                        <option value="1">1st Semester</option>
                        <option value="2">2nd Semester</option>
                        <option value="3">3rd Semester</option>
                        <option value="4">4th Semester</option>
                        <option value="5">5th Semester</option>
                        <option value="6">6th Semester</option>
                        <option value="7">7th Semester</option>
                        <option value="8">8th Semester</option>
                    </select>
                </div>

            </div>

            <button type="submit" class="submit-button">
                Submit Student Information
            </button>

        </form>
        
<p style="text-align: center; margin-top: 20px;">
    <a href="/students">View Registered Students</a>
</p>


    </main>

    <footer class="footer">
        University Student Portal | Student Registration System
    </footer>

</body>
</html>
